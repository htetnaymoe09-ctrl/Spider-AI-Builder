<!doctype html><html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spider AI Builder</title><style>body{margin:0;background:#080b17;color:#eef;font-family:system-ui,sans-serif}header{padding:20px;background:#12182d;text-align:center}h1{margin:5px;font-size:25px;color:#d6a8ff}.sub{color:#a9aec9;font-size:13px}.spider{font-size:75px;text-align:center;filter:drop-shadow(0 0 15px #9b45ff);animation:bob 2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-12px)}}main{padding:16px;max-width:650px;margin:auto}.panel{background:#151b31;border:1px solid #47306e;border-radius:18px;padding:16px;margin:12px 0}textarea{width:100%;min-height:95px;box-sizing:border-box;background:#090e20;border:1px solid #66518c;border-radius:10px;color:white;padding:12px;font:inherit}button{background:#873df3;color:white;border:0;border-radius:10px;padding:13px 18px;font-weight:700;margin-top:10px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#080e1c;padding:12px;border-radius:10px;max-height:330px;overflow:auto}.muted{color:#aab0ca;font-size:13px}</style></head><body><header><h1>🕷 Spider AI Builder</h1><div class="sub">Android App Project Assistant · Starter Prototype</div></header><main><div class="spider">🕷️</div><div class="panel"><b>Spider ကို App အကြောင်း ခိုင်းပါ</b><p class="muted">ဥပမာ: music app, calculator app, notes app</p><textarea id="prompt" placeholder="ဖန်တီးချင်တဲ့ App ကို ရေးပါ..."></textarea><button onclick="generate()">Project Starter ထုတ်မယ်</button><p id="status" class="muted">Offline demo — AI API မချိတ်ရသေးပါ။</p></div><div class="panel"><b>Generated starter code</b><pre id="output">အပေါ်မှာ App အမျိုးအစား ရေးပြီး စတင်ပါ။</pre><button onclick="download()">HTML Project Download</button></div></main><script>let result='';function generate(){const p=document.getElementById('prompt').value.trim();if(!p){alert('App အကြောင်းရေးပါ');return}const safe=p.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));result='<!doctype html>\n<html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My App</title><style>body{font-family:system-ui;background:#101627;color:white;text-align:center;padding:35px}button{padding:12px;border:0;border-radius:8px;background:#8952ef;color:white}</style></head><body><h1>'+safe+'</h1><p>Starter project: add app features here.</p><button onclick="alert(\'Working starter!\')">Start</button></body></html>';document.getElementById('output').textContent=result;document.getElementById('status').textContent='Starter HTML ထုတ်ပြီးပါပြီ။ AI-generated code မဟုတ်သေးပါ။';}function download(){if(!result){alert('Project အရင်ထုတ်ပါ');return}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([result],{type:'text/html'}));a.download='my_app_starter.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}</script></body></html>
